# Generated by tools/visual-software/generate_workflow.py; upstream 1.4.9.
name: Visual Software — Windows, Linux, macOS, Android
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: visual-software-${{ github.ref }}
  cancel-in-progress: false
env:
  SCITER_RUST_VERSION: '1.75'
  RUST_VERSION: '1.75'
  MAC_RUST_VERSION: '1.81'
  CARGO_NDK_VERSION: 3.1.2
  SCITER_ARMV7_CMAKE_VERSION: 3.29.7
  SCITER_NASM_DEBVERSION: 2.15.05-1
  LLVM_VERSION: 15.0.6
  FLUTTER_VERSION: 3.24.5
  ANDROID_FLUTTER_VERSION: 3.24.5
  FLUTTER_WINDOWS_ARM_VERSION: 3.44.0
  FLUTTER_ELINUX_VERSION: 3.16.9
  TAG_NAME: visual-software-1.4.9
  VCPKG_BINARY_SOURCES: clear;x-gha,readwrite
  VCPKG_COMMIT_ID: 120deac3062162151622ca4860575a33844ba10b
  ARMV7_VCPKG_COMMIT_ID: 6f29f12e82a8293156836ad81cc9bf5af41fe836
  VERSION: 1.4.9
  NDK_VERSION: r28c
  ANDROID_SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
  MACOS_P12_BASE64: ${{ secrets.MACOS_P12_BASE64 }}
  UPLOAD_ARTIFACT: 'true'
  SIGN_BASE_URL: ${{ secrets.SIGN_BASE_URL }}-2
  RENDEZVOUS_SERVER: ${{ secrets.RENDEZVOUS_SERVER }}
  RS_PUB_KEY: ${{ secrets.RS_PUB_KEY }}
  RELAY_SERVER: ${{ secrets.RELAY_SERVER }}
  API_SERVER: ${{ secrets.API_SERVER }}
jobs:
  validate-configuration:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
    - name: Test public server configuration validation
      run: python3 -m unittest discover -s tools/visual-software -p 'test_*.py'
    - name: Embed Visual Software server settings
      shell: bash
      run: python3 tools/visual-software/configure_server.py
    - name: Check Android release signing credentials
      env:
        ANDROID_SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
        ANDROID_ALIAS: ${{ secrets.ANDROID_ALIAS }}
        ANDROID_KEY_STORE_PASSWORD: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
        ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      run: |
        python3 - <<'PY'
        import os, sys
        required = ['ANDROID_SIGNING_KEY', 'ANDROID_ALIAS', 'ANDROID_KEY_STORE_PASSWORD', 'ANDROID_KEY_PASSWORD']
        missing = [k for k in required if not os.environ.get(k)]
        if missing:
            sys.exit('Missing Android signing secrets: ' + ', '.join(missing))
        print('Android signing configuration present; values hidden.')
        PY
  generate-bridge:
    uses: ./.github/workflows/visual-software-bridge.yml
    needs:
    - validate-configuration
    secrets: inherit
  build-RustDeskTempTopMostWindow:
    uses: ./.github/workflows/third-party-RustDeskTempTopMostWindow.yml
    strategy:
      fail-fast: false
      matrix:
        job:
        - target: windows-2022
          platform: x64
        - target: windows-11-arm
